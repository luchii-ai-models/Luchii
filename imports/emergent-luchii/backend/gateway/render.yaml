services:
  - type: web
    name: frasberg-gateway
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: standard
    envVars:
      - key: FRB_ENV
        value: production
      - key: LUCHII_INTERNAL_URL
        value: https://frasberg.com/api
