apiVersion: apps/v1
kind: Deployment
metadata:
  name: luchii-backend
  namespace: luchii-mesh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: luchii-backend
  template:
    metadata:
      labels:
        app: luchii-backend
    spec:
      containers:
        - name: luchii-backend
          image: frasberginc/luchii-backend:latest   # build with: docker build -f selfhost/backend.Dockerfile -t frasberginc/luchii-backend .
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: luchii-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: luchii-backend
  namespace: luchii-mesh
spec:
  selector:
    app: luchii-backend
  ports:
    - port: 8001
      targetPort: 8001
