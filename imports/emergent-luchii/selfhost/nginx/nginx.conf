events { worker_connections 2048; }

http {
  # ─── HTTP -> HTTPS redirect + ACME challenge ─────────────
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS: frontend + API + WSS mesh tunnel ─────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Replace 'yourdomain.com' with your domain after running certbot
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-Luchii-Mesh "frasberg-secure-v1";

    client_max_body_size 25m;

    # ─── Luchii Mesh WebSocket ───────────────────────────
    location /api/ws/ {
      proxy_pass         http://backend:8001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ─── REST API + SSE chat streaming ───────────────────
    location /api/ {
      proxy_pass         http://backend:8001;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_buffering    off;          # critical for SSE streaming
      proxy_read_timeout 3600s;
    }

    # ─── React frontend ──────────────────────────────────
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
    }
  }
}
