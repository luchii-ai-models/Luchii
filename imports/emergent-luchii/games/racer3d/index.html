<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Las Vegas Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 16px 24px; color: #fff; font-size: 15px; pointer-events: none; z-index: 5; }
  #hud span { background: rgba(13,13,26,0.6); padding: 6px 14px; border-radius: 8px; border: 1px solid #6c63ff44; }
  .screen { position: fixed; inset: 0; background: rgba(13,13,26,0.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; z-index: 10; text-align: center; }
  .screen h1 { color: #6c63ff; font-size: 44px; letter-spacing: 6px; margin-bottom: 12px; }
  .screen p { color: #aaa; margin-bottom: 8px; }
  .screen button { margin-top: 24px; padding: 14px 42px; background: #6c63ff; color: #fff; border: none;
    border-radius: 30px; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: 2px; font-family: inherit; }
  .screen button:hover { background: #857dff; }
  #gameover { display: none; }
</style>
</head>
<body>
<script src="/api/games/assets/env.js"></script>
<div id="hud">
  <span>⚡ SPEED <b id="speed">120</b> km/h</span>
  <span>⭐ SCORE <b id="score">0</b></span>
</div>
<div id="start" class="screen">
  <h1>⬡ LAS VEGAS RACER</h1>
  <p>The Strip · Night Circuit · Cybertruck</p>
  <p>A/D or ←/→ steer · W/↑ boost · Overtake for bonus points</p>
  <button id="startBtn">IGNITION</button>
</div>
<div id="gameover" class="screen">
  <h1>WRECKED</h1>
  <p id="finalScore"></p>
  <button id="restartBtn">RESTART ENGINE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0d1a, 0.012);
scene.background = null;
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.AmbientLight(0xaa99ff, 0.7));
const sun = new THREE.DirectionalLight(0xffc48a, 0.9); sun.position.set(-4, 12, 6); scene.add(sun);

// ── The Strip: curves, hills, scrolling world ──────────────
const LANES = [-3.4, 0, 3.4];
const NEAR = 14, LOOP = 452;
let curve = 0, curveTarget = 0, curveTimer = 4, dist = 0;
const bendX = (z) => curve * Math.pow(Math.max(0, -z) / 220, 2) * 30;
const hillY = (z) => Math.sin((dist * 0.9 + z) * 0.012) * 2.2;

const scrollers = [];
function addScroller(obj, opts = {}) {
  obj.userData = Object.assign({ baseX: obj.position.x, baseY: obj.position.y }, opts);
  scrollers.push(obj); scene.add(obj);
}

// Road segments (bend with the curve)
const roadMat = new THREE.MeshStandardMaterial({ color: 0x191926 });
for (let i = 0; i < 34; i++) {
  const seg = new THREE.Mesh(new THREE.PlaneGeometry(11.6, 14.4), roadMat);
  seg.rotation.x = -Math.PI/2; seg.position.set(0, 0, NEAR - i * 13.6);
  addScroller(seg);
}
// Lane stripes
for (let i = 0; i < 46; i++) {
  [-1.7, 1.7].forEach(x => {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 2.6), new THREE.MeshBasicMaterial({ color: 0xffd24a }));
    s.rotation.x = -Math.PI/2; s.position.set(x, 0.02, NEAR - i * 9.7);
    addScroller(s);
  });
}
// Neon edge posts
for (let i = 0; i < 60; i++) {
  [-5.9, 5.9].forEach(x => {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 1.6), new THREE.MeshBasicMaterial({ color: 0xff2d78 }));
    p.position.set(x, 0.25, NEAR - i * 7.5);
    addScroller(p);
  });
}

// Real Vegas casino towers (AI-rendered facades) + local stores
const texLoader = new THREE.TextureLoader();
const facades = [texLoader.load("/api/games/assets/vegas-facade-1.jpg"), texLoader.load("/api/games/assets/vegas-facade-2.jpg")];
function signTexture(text, color) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(8,8,16,0.85)"; g.fillRect(0, 0, 256, 64);
  g.font = "bold 34px 'Courier New'"; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = color; g.shadowBlur = 18; g.fillStyle = color;
  g.fillText(text, 128, 34);
  return new THREE.CanvasTexture(c);
}
const CASINOS = ["CASINO","LUX","MIRAGE","VEGAS","PALMS","STARDUST","FLAMINGO","ROYALE"];
const STORES  = ["DINER","MOTEL","SLOTS","GIFTS","LIQUOR","24H MART"];
const NEON    = ["#ff2d78","#ffd24a","#4affd2","#7a6bff","#ff7a3c"];
for (let i = 0; i < 26; i++) {
  const side = i % 2 ? 1 : -1;
  const isShop = i % 4 === 3;
  const w = isShop ? 5 + Math.random()*3 : 7 + Math.random()*8;
  const h = isShop ? 2.6 + Math.random()*1.8 : 10 + Math.random()*26;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 7),
    isShop ? new THREE.MeshStandardMaterial({ color: 0x232338 })
           : new THREE.MeshBasicMaterial({ map: facades[i % 2] }));
  const x = side * (isShop ? 9.6 : 11 + Math.random()*9);
  b.position.set(x, h/2, NEAR - i * 17 - Math.random()*8);
  const label = isShop ? STORES[i % STORES.length] : CASINOS[i % CASINOS.length];
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 1.5),
    new THREE.MeshBasicMaterial({ map: signTexture(label, NEON[i % NEON.length]), transparent: true }));
  sign.position.set(-side * (w/2 + 0.06), h * 0.34, 0);
  sign.rotation.y = side > 0 ? -Math.PI/2 : Math.PI/2;
  b.add(sign);
  addScroller(b);
}
// Palm trees
for (let i = 0; i < 22; i++) {
  [-7.7, 7.7].forEach(x => {
    const palm = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 2.7, 6), new THREE.MeshStandardMaterial({ color: 0x6b4a2b }));
    trunk.position.y = 1.35;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.25, 1, 6), new THREE.MeshStandardMaterial({ color: 0x1f8a4c }));
    leaves.position.y = 3;
    const leaves2 = leaves.clone(); leaves2.position.y = 2.75; leaves2.rotation.y = 0.5; leaves2.scale.setScalar(1.25);
    palm.add(trunk, leaves, leaves2);
    palm.position.set(x, 0, NEAR - i * 19.6 - (x > 0 ? 9 : 0));
    addScroller(palm);
  });
}
// Street lights
for (let i = 0; i < 16; i++) {
  [-6.8, 6.8].forEach(x => {
    const lamp = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.1, 0.08), new THREE.MeshStandardMaterial({ color: 0x3a3a4e }));
    pole.position.y = 1.55;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 8, 6), new THREE.MeshBasicMaterial({ color: 0xfff4c8 }));
    head.position.y = 3.15;
    lamp.add(pole, head);
    lamp.position.set(x, 0, NEAR - i * 27 - (x > 0 ? 13 : 0));
    addScroller(lamp);
  });
}

// ── Traffic cars ──────────────────────────────────────────
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 3), new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.3 }));
  body.position.y = 0.45; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.45, 1.4), new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8 }));
  cab.position.set(0, 0.85, -0.1); g.add(cab);
  const tl = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.1, 0.06), new THREE.MeshBasicMaterial({ color: 0xff3333 }));
  tl.position.set(0, 0.55, 1.53); g.add(tl);
  [[-0.8,-1],[0.8,-1],[-0.8,1],[0.8,1]].forEach(([x,z]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.3, 12), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
    w.rotation.z = Math.PI/2; w.position.set(x, 0.32, z); g.add(w);
  });
  return g;
}

// ── Player: Tesla Cybertruck ──────────────────────────────
function makeCybertruck() {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(-1.85, 0.35); shape.lineTo(-1.85, 1.0); shape.lineTo(-0.15, 1.42);
  shape.lineTo(1.95, 0.72); shape.lineTo(1.95, 0.35); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 1.9, bevelEnabled: false });
  geo.translate(0, 0, -0.95);
  const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xb9bfc7, metalness: 0.85, roughness: 0.28 }));
  body.rotation.y = Math.PI/2;
  g.add(body);
  const win = new THREE.Mesh(new THREE.BoxGeometry(1.68, 0.26, 1.7), new THREE.MeshStandardMaterial({ color: 0x0c0f14, metalness: 0.9, roughness: 0.1 }));
  win.position.set(0, 1.03, 0.15); g.add(win);
  const lb = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.08, 0.06), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  lb.position.set(0, 0.9, -1.88); g.add(lb);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.08, 0.06), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  tb.position.set(0, 0.8, 1.92); g.add(tb);
  [[-0.98,-1.15],[0.98,-1.15],[-0.98,1.15],[0.98,1.15]].forEach(([x,z]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.34, 12), new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
    w.rotation.z = Math.PI/2; w.position.set(x, 0.42, z); g.add(w);
  });
  return g;
}
const player = makeCybertruck();
player.position.set(0, 0, 4);
scene.add(player);
const glow = new THREE.PointLight(0xcfe8ff, 2, 9); glow.position.set(0, 1, 5); scene.add(glow);

// ── Traffic waves — ALWAYS leaves a free lane ─────────────
let traffic = [];
const COLORS = [0xff3355, 0xffaa22, 0x22ccff, 0x44ff88, 0xffffff, 0xaa66ff];
function laneCombo() {
  const n = Math.random() < 0.55 ? 2 : 1;   // never all 3 lanes
  return [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, n);
}
function spawnWave(z) {
  for (const li of laneCombo()) {
    const car = makeCar(COLORS[Math.floor(Math.random()*COLORS.length)]);
    car.position.set(LANES[li], 0, z + (Math.random()*4 - 2));
    car.rotation.y = Math.PI;
    car.userData = { passed: false, baseLane: LANES[li] };
    scene.add(car); traffic.push(car);
  }
}
function recycleCar(t) {
  let z = Math.min(...traffic.map(c => c.position.z)) - (30 + Math.random()*18);
  for (let tries = 0; tries < 4; tries++) {
    const lane = Math.floor(Math.random()*3);
    const nearby = traffic.filter(c => c !== t && Math.abs(c.position.z - z) < 12);
    if (nearby.length < 2) {                       // never a 3-car wall
      t.position.set(LANES[lane], 0, z);
      t.userData.passed = false;
      t.userData.baseLane = LANES[lane];
      return;
    }
    z -= 14;
  }
  t.userData.baseLane = LANES[Math.floor(Math.random()*3)];
  t.position.set(t.userData.baseLane, 0, z);
  t.userData.passed = false;
}

const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

// ── Nitro pickups + near-miss slow-mo ─────────────────────
let pickups = [], nitroT = 0, slowT = 0;
function flashMsg(t, color) {
  let el = document.getElementById("flashMsg");
  if (!el) {
    el = document.createElement("div"); el.id = "flashMsg";
    el.style.cssText = "position:fixed;top:30%;left:50%;transform:translateX(-50%);z-index:8;font:bold 22px 'Courier New';letter-spacing:3px;text-shadow:0 0 14px #000;transition:opacity .3s";
    document.body.appendChild(el);
  }
  el.style.color = color || "#4affd2";
  el.textContent = t;
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, 1100);
}
function spawnPickup(z) {
  const p = new THREE.Mesh(new THREE.OctahedronGeometry(0.55), new THREE.MeshBasicMaterial({ color: 0x4affd2 }));
  p.position.set(LANES[Math.floor(Math.random()*3)], 0.9, z);
  p.userData = { baseLane: p.position.x };
  scene.add(p); pickups.push(p);
}
function recyclePickup(p) {
  p.userData.baseLane = LANES[Math.floor(Math.random()*3)];
  p.position.set(p.userData.baseLane, 0.9, -260 - Math.random()*120);
}

let running = false, speed = 30, score = 0, px = 0;
function hud() {
  document.getElementById("speed").textContent = Math.round((speed + (nitroT > 0 ? 26 : 0)) * 4);
  document.getElementById("score").textContent = Math.floor(score);
}
function start() {
  traffic.forEach(t => scene.remove(t)); traffic = [];
  pickups.forEach(p => scene.remove(p)); pickups = [];
  for (let i = 1; i <= 6; i++) spawnWave(-40 - i * 36);
  for (let i = 0; i < 3; i++) spawnPickup(-90 - i * 110);
  speed = 30; score = 0; px = 0; dist = 0; curve = 0; curveTarget = 0; nitroT = 0; slowT = 0;
  player.position.x = 0;
  document.getElementById("start").style.display = "none";
  document.getElementById("gameover").style.display = "none";
  running = true;
}
function gameOver() {
  running = false;
  document.getElementById("finalScore").textContent = `Distance ${Math.floor(score)} · Top speed ${Math.round(speed*4)} km/h`;
  document.getElementById("gameover").style.display = "flex";
}
document.getElementById("startBtn").onclick = start;
document.getElementById("restartBtn").onclick = start;

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) {
    slowT = Math.max(0, slowT - dt);
    nitroT = Math.max(0, nitroT - dt);
    const ts = slowT > 0 ? 0.35 : 1;                      // near-miss slow motion
    const eff = speed + (nitroT > 0 ? 26 : 0);            // nitro boost
    const wdt = dt * ts;
    speed += dt * 0.55;
    if (keys["KeyW"] || keys["ArrowUp"]) speed += dt * 6;
    speed = Math.min(speed, 80);
    if (keys["KeyA"] || keys["ArrowLeft"]) px -= 10 * dt;
    if (keys["KeyD"] || keys["ArrowRight"]) px += 10 * dt;
    px += curve * dt * 2.4;                       // the road pulls through turns
    px = Math.max(-4.4, Math.min(4.4, px));
    player.position.x += (px - player.position.x) * 10 * dt;
    player.rotation.z = (player.position.x - px) * 0.25;
    player.position.y = hillY(4);
    dist += eff * wdt;
    score += eff * wdt;
    // Nitro camera kick
    const targetFov = nitroT > 0 ? 82 : 70;
    if (Math.abs(camera.fov - targetFov) > 0.3) { camera.fov += (targetFov - camera.fov) * dt * 6; camera.updateProjectionMatrix(); }
    // Curve director
    curveTimer -= dt;
    if (curveTimer <= 0) { curveTarget = (Math.random()*2 - 1) * 0.9; curveTimer = 5 + Math.random()*6; }
    curve += (curveTarget - curve) * dt * 0.35;
    hud();
    // Nitro pickups
    for (const p of pickups) {
      p.position.z += eff * wdt;
      p.rotation.y += dt * 4;
      if (p.position.z > 8) recyclePickup(p);
      p.position.x = p.userData.baseLane + bendX(p.position.z);
      p.position.y = 0.9 + hillY(p.position.z);
      if (Math.abs(p.position.z - player.position.z) < 2 && Math.abs(p.position.x - player.position.x) < 1.3) {
        nitroT = 2.5; score += 100;
        flashMsg("⚡ NITRO +100", "#4affd2");
        window.SFX && SFX.tone(500, 1600, 0.25, "sawtooth", 0.18);
        recyclePickup(p);
      }
    }
    // Traffic
    for (const t of traffic) {
      t.position.z += eff * wdt * 0.82;
      if (!t.userData.passed && t.position.z > player.position.z) {
        t.userData.passed = true;
        score += 40;
        window.SFX && SFX.tone(700, 1500, 0.12, "sine", 0.12);
      }
      if (t.position.z > 10) recycleCar(t);
      t.position.x = t.userData.baseLane + bendX(t.position.z);
      t.position.y = hillY(t.position.z);
      const dz = Math.abs(t.position.z - player.position.z), dx = Math.abs(t.position.x - player.position.x);
      // Near-miss: brushing past a car triggers slow-mo + bonus
      if (!t.userData.nearMiss && dz < 2.4 && dx > 1.55 && dx < 2.5) {
        t.userData.nearMiss = true;
        slowT = 0.55; score += 60;
        flashMsg("NEAR MISS +60", "#ffd24a");
        window.SFX && SFX.tone(300, 90, 0.3, "triangle", 0.15);
      }
      if (dz < 2.7 && dx < 1.55) gameOver();
    }
    // Scroll the Strip
    for (const s of scrollers) {
      s.position.z += eff * wdt;
      if (s.position.z > NEAR + 10) s.position.z -= LOOP;
      s.position.x = s.userData.baseX + bendX(s.position.z);
      s.position.y = s.userData.baseY + hillY(s.position.z);
    }
  }
  camera.position.set(player.position.x * 0.5 + curve * 1.6, 3.3 + hillY(10), 10);
  camera.lookAt(player.position.x * 0.5 + curve * 7, 0.8 + hillY(-40), -12);
  camera.rotation.z += -curve * 0.05;
  renderer.render(scene, camera);
}
animate();

// ── Racer V8 engine synth (real gear shifts) ──────────────
window.RacerEngine = (function () {
  let c = null, o1 = null, o2 = null, g = null, f = null, n = null, ng = null;
  function start() {
    if (o1) return;
    try {
      c = c || new (window.AudioContext || window.webkitAudioContext)();
      o1 = c.createOscillator(); o1.type = "sawtooth";
      o2 = c.createOscillator(); o2.type = "square";
      g = c.createGain(); g.gain.value = 0;
      f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380; f.Q.value = 4;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
      o1.start(); o2.start();
      g.gain.linearRampToValueAtTime(0.15, c.currentTime + 0.4);
      const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
      n = c.createBufferSource(); n.buffer = buf; n.loop = true;
      ng = c.createGain(); ng.gain.value = 0.02;
      const nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 130;
      n.connect(nf); nf.connect(ng); ng.connect(c.destination); n.start();
    } catch (_) {}
  }
  function setKmh(kmh) {
    if (!o1) return;
    try {
      const gear = Math.min(5, Math.floor(kmh / 62));
      const rpm  = (kmh - gear * 62) / 62;
      const base = 46 + gear * 10 + rpm * 95;
      o1.frequency.setTargetAtTime(base * 2, c.currentTime, 0.05);
      o2.frequency.setTargetAtTime(base, c.currentTime, 0.05);
      f.frequency.setTargetAtTime(280 + rpm * 1400 + gear * 120, c.currentTime, 0.08);
      ng.gain.setTargetAtTime(0.015 + rpm * 0.022, c.currentTime, 0.1);
    } catch (_) {}
  }
  function stop() {
    try {
      g && g.gain.setTargetAtTime(0, c.currentTime, 0.08);
      const t = c.currentTime + 0.4;
      o1 && o1.stop(t); o2 && o2.stop(t); n && n.stop(t);
    } catch (_) {}
    o1 = o2 = n = null;
  }
  return { start, setKmh, stop };
})();
</script>
<script>
// ─── Leaderboard ──────────────────────────────────────────
const GID = "racer3d";
const lbScore = () => Math.floor(score);
(function () {
  document.getElementById("gameover").insertAdjacentHTML("beforeend", `
    <div style="margin-top:20px;width:min(340px,84vw)">
      <div style="display:flex;gap:8px">
        <input id="lbName" maxlength="20" placeholder="Your name" style="flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid #6c63ff66;background:#1a1a2e;color:#fff;font-family:inherit;outline:none">
        <button id="lbSubmit" style="padding:10px 18px;border-radius:12px;border:none;background:#6c63ff;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer;letter-spacing:1px">SUBMIT</button>
      </div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
        <span style="color:#6c63ff;font-size:12px;letter-spacing:2px">⬡ TOP DRIVERS</span>
        <span style="display:flex;gap:6px">
          <button id="lbAll" class="lbTab" style="background:#6c63ff">ALL-TIME</button>
          <button id="lbWeek" class="lbTab" style="background:transparent">WEEK</button>
        </span>
      </div>
      <style>.lbTab{padding:4px 10px;border-radius:8px;border:1px solid #6c63ff66;color:#fff;font-family:inherit;font-size:10px;letter-spacing:1px;cursor:pointer}</style>
      <ol id="lbList" style="list-style:none;margin-top:8px;text-align:left;font-size:13px;color:#aaa;max-height:170px;overflow:auto"></ol>
    </div>`);
  const esc = (s) => String(s).replace(/[<>&]/g, "");
  let lbPeriod = "all";
  function setPeriod(p) {
    lbPeriod = p;
    document.getElementById("lbAll").style.background = p === "all" ? "#6c63ff" : "transparent";
    document.getElementById("lbWeek").style.background = p === "weekly" ? "#6c63ff" : "transparent";
    lbLoad();
  }
  document.getElementById("lbAll").addEventListener("click", () => setPeriod("all"));
  document.getElementById("lbWeek").addEventListener("click", () => setPeriod("weekly"));
  async function lbLoad() {
    try {
      const d = await (await fetch("/api/games/" + GID + "/scores?period=" + lbPeriod)).json();
      document.getElementById("lbList").innerHTML = d.map((s, i) =>
        `<li style="display:flex;justify-content:space-between;padding:3px 2px"><span>${i + 1}. ${esc(s.name)}</span><b style="color:#fff">${s.score}</b></li>`).join("") || "<li>No scores yet — be the first.</li>";
    } catch (_) {}
  }
  document.getElementById("lbName").value = localStorage.getItem("luchii-player-name") || "";
  document.getElementById("lbSubmit").addEventListener("click", async () => {
    const name = (document.getElementById("lbName").value || "PLAYER").trim().slice(0, 20) || "PLAYER";
    try { localStorage.setItem("luchii-player-name", name); } catch (_) {}
    try {
      await fetch("/api/games/" + GID + "/scores", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, score: lbScore() }) });
      document.getElementById("lbSubmit").textContent = "SAVED ✓";
      lbLoad();
    } catch (_) {}
  });
  const _gameOver = gameOver;
  gameOver = function () { _gameOver(); document.getElementById("lbSubmit").textContent = "SUBMIT"; lbLoad(); };
})();

// ─── Touch Controls — 360° steering stick + boost ──────────
(function () {
  if (!(matchMedia("(pointer: coarse)").matches || new URLSearchParams(location.search).has("touch"))) return;
  document.body.insertAdjacentHTML("beforeend", `
    <style>
      .tc{position:fixed;z-index:8;user-select:none;-webkit-user-select:none;touch-action:none}
      #stick{left:22px;bottom:26px;width:118px;height:118px;border-radius:50%;background:rgba(108,99,255,.10);border:1px solid rgba(108,99,255,.45)}
      #stickKnob{position:absolute;left:37px;top:37px;width:44px;height:44px;border-radius:50%;background:rgba(108,99,255,.55);pointer-events:none}
      #stickLbl{position:absolute;top:-18px;left:0;right:0;text-align:center;color:rgba(160,155,255,.7);font:bold 9px 'Courier New';letter-spacing:2px}
      .tcBtn{width:78px;height:78px;border-radius:50%;background:rgba(108,99,255,.22);border:1px solid rgba(108,99,255,.6);color:#fff;font:bold 11px 'Courier New';letter-spacing:1px}
    </style>
    <div id="stick" class="tc"><div id="stickKnob"></div><span id="stickLbl">STEER</span></div>
    <button id="btnBoost" class="tc tcBtn" style="right:22px;bottom:34px">BOOST</button>`);
  const el = document.getElementById("stick"), knob = document.getElementById("stickKnob");
  let id = null, cx = 0, cy = 0;
  const reset = () => { id = null; knob.style.transform = ""; keys["ArrowLeft"] = keys["ArrowRight"] = keys["ArrowUp"] = false; };
  el.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.changedTouches[0]; id = t.identifier;
    const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
  });
  el.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === id) {
      const dx = t.clientX - cx, dy = t.clientY - cy;
      const m = Math.min(Math.hypot(dx, dy), 40), a = Math.atan2(dy, dx);
      knob.style.transform = `translate(${Math.cos(a) * m}px,${Math.sin(a) * m}px)`;
      keys["ArrowLeft"] = dx < -12; keys["ArrowRight"] = dx > 12; keys["ArrowUp"] = dy < -16;
    }
  });
  el.addEventListener("touchend", reset);
  el.addEventListener("touchcancel", reset);
  const bb = document.getElementById("btnBoost");
  bb.addEventListener("touchstart", (e) => { e.preventDefault(); keys["ArrowUp"] = true; });
  bb.addEventListener("touchend", (e) => { e.preventDefault(); keys["ArrowUp"] = false; });
  bb.addEventListener("touchcancel", () => keys["ArrowUp"] = false);
})();
</script>
<script>
// ─── SFX Engine + Champion banner ─────────────────────────
(function () {
  let ctx = null, muted = false, engO = null, engG = null;
  try { muted = localStorage.getItem("luchii-sfx-muted") === "1"; } catch (_) {}
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(f0, f1, dur, type, vol) {
    if (muted) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
    } catch (_) {}
  }
  function engineStart() {
    if (muted || engO) return;
    engO = true;
    window.RacerEngine && RacerEngine.start();
  }
  function engineStop() { window.RacerEngine && RacerEngine.stop(); engO = engG = null; }
  window.SFX = {
    tone, engineStart, engineStop,
    setEngine(f) { if (engO && window.RacerEngine) RacerEngine.setKmh(f); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem("luchii-sfx-muted", muted ? "1" : "0"); } catch (_) {}
      if (muted) engineStop(); else if (running) engineStart();
      return muted;
    },
  };
  document.body.insertAdjacentHTML("beforeend",
    `<button id="sfxBtn" style="position:fixed;top:60px;right:24px;z-index:9;padding:8px 14px;border-radius:20px;border:1px solid #6c63ff66;background:rgba(13,13,26,.7);color:#fff;font:bold 11px 'Courier New';letter-spacing:1px;cursor:pointer">SFX ${muted ? "OFF" : "ON"}</button>`);
  document.getElementById("sfxBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("sfxBtn").textContent = "SFX " + (window.SFX.toggle() ? "OFF" : "ON");
  });
  // Hooks: engine hum scales with speed, crash on wreck
  document.getElementById("startBtn").addEventListener("click", engineStart);
  document.getElementById("restartBtn").addEventListener("click", engineStart);
  setInterval(() => { if (running) window.SFX.setEngine(speed * 4); }, 150);
  const _goR = gameOver;
  gameOver = function () { engineStop(); if (!muted) LuchiiAudio.sfx("crash", 0.7); _goR(); };
})();
// Champion — score to beat
(function () {
  fetch("/api/games/" + GID + "/scores").then((r) => r.json()).then((d) => {
    if (!d.length) return;
    const c = d[0];
    document.querySelector("#start button").insertAdjacentHTML("beforebegin",
      `<p id="champLine" style="color:#fbbf24;margin-top:6px">♛ CHAMPION: ${String(c.name).replace(/[<>&]/g, "")} · ${c.score} — the score to beat</p>`);
  }).catch(() => {});
})();
// ─── Music + Gamepad ──────────────────────────────────────
(function () {
  let ctx = null, playing = false, timer = null, master = null;
  let mMuted = false, vol = 0.5;
  try { mMuted = localStorage.getItem("luchii-music-muted") === "1"; vol = parseFloat(localStorage.getItem("luchii-music-vol") || "0.5"); } catch (_) {}
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  const CFG = { bpm: 128, root: 55, bass: [0, 0, 5, 7], lead: [0, 4, 7, 12, 7, 4, 0, -5] };
  function note(f, t, dur, type, g, slide) {
    const c = ac(), o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(f / 4, 1), t + dur);
    gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(gn).connect(master); o.start(t); o.stop(t + dur);
  }
  function startMusic() {
    if (playing || mMuted) return;
    playing = true;
    window.LuchiiAudio && LuchiiAudio.music.start("/api/games/assets/music-racer3d.ogg", vol);
  }
  function stopMusic() { playing = false; window.LuchiiAudio && LuchiiAudio.music.stop(); }
  document.body.insertAdjacentHTML("beforeend", `
    <div id="musicCtl" style="position:fixed;top:102px;right:24px;z-index:9;display:flex;gap:8px;align-items:center;background:rgba(13,13,26,.7);border:1px solid #6c63ff66;border-radius:20px;padding:6px 12px">
      <button id="musicBtn" style="border:none;background:none;color:#fff;font:bold 11px 'Courier New';letter-spacing:1px;cursor:pointer">MUSIC ${mMuted ? "OFF" : "ON"}</button>
      <input id="musicVol" type="range" min="0" max="1" step="0.05" value="${vol}" style="width:70px;accent-color:#6c63ff">
    </div>
    <div id="padPill" style="display:none;position:fixed;top:60px;right:110px;z-index:9;padding:8px 14px;border-radius:20px;border:1px solid #44ffaa66;background:rgba(13,13,26,.7);color:#44ffaa;font:bold 11px 'Courier New';letter-spacing:1px">PAD CONNECTED</div>`);
  document.getElementById("musicBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    mMuted = !mMuted;
    try { localStorage.setItem("luchii-music-muted", mMuted ? "1" : "0"); } catch (_) {}
    document.getElementById("musicBtn").textContent = "MUSIC " + (mMuted ? "OFF" : "ON");
    if (mMuted) stopMusic(); else if (running) startMusic();
  });
  document.getElementById("musicVol").addEventListener("input", (e) => {
    vol = parseFloat(e.target.value);
    try { localStorage.setItem("luchii-music-vol", String(vol)); } catch (_) {}
    window.LuchiiAudio && LuchiiAudio.music.setVol(vol);
  });
  document.getElementById("startBtn").addEventListener("click", startMusic);
  document.getElementById("restartBtn").addEventListener("click", startMusic);
  // Gamepad
  let padIdx = null, prevBtns = {}, padKeys = {};
  window.addEventListener("gamepadconnected", (e) => { padIdx = e.gamepad.index; document.getElementById("padPill").style.display = "block"; });
  window.addEventListener("gamepaddisconnected", (e) => { if (e.gamepad.index === padIdx) { padIdx = null; document.getElementById("padPill").style.display = "none"; } });
  function pressStart() {
    for (const id of ["startBtn", "restartBtn"]) {
      const el = document.getElementById(id);
      if (el && el.offsetParent !== null) { el.click(); return; }
    }
  }
  const DZ = 0.28;
  (function padLoop() {
    requestAnimationFrame(padLoop);
    const gp = padIdx !== null ? navigator.getGamepads()[padIdx] : null;
    if (!gp) return;
    const lx = gp.axes[0] || 0;
    const set = {};
    if (lx < -DZ) set["ArrowLeft"] = 1; if (lx > DZ) set["ArrowRight"] = 1;
    if (gp.buttons[0]?.pressed || gp.buttons[7]?.pressed) set["ArrowUp"] = 1;
    for (const k in padKeys) if (!set[k]) keys[k] = false;
    for (const k in set) keys[k] = true;
    padKeys = set;
    if (gp.buttons[9]?.pressed && !prevBtns[9]) pressStart();
    prevBtns = { 9: gp.buttons[9]?.pressed };
  })();
})();
</script>
