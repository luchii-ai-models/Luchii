# ── Frasberg Carjack Game — CI/CD Pipeline ────────────────────────────────────
# Triggers: push to main, pull requests, manual dispatch
# Stages: lint → test → build → docker → deploy → notify
name: Frasberg CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - rollback

env:
  REGISTRY: ghcr.io
  IMAGE_GAME: ghcr.io/${{ github.repository }}/game-server
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web-client
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1 — Lint & Type Check ───────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck --if-present
        continue-on-error: true

  # ── JOB 2 — Test Suite ──────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --if-present
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: test-secret-ci

  # ── JOB 3 — Build Web Client ────────────────────────────────────────────────
  build-web:
    name: 🏗️ Build Web Client
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_WS_URL: wss://game.yourdomain.com/ws
          VITE_API_URL: https://game.yourdomain.com
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  # ── JOB 4 — Docker Build & Push ─────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, build-web]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata — Game Server
        id: meta-game
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_GAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push — Game Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta-game.outputs.tags }}
          labels: ${{ steps.meta-game.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata — Web Client
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & Push — Web Client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 5 — Deploy to Staging ───────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Deploy to staging namespace
        run: |
          kubectl set image deployment/frasberg-game-server \
            game-server=${{ env.IMAGE_GAME }}:sha-${{ github.sha }} \
            -n frasberg-staging
          kubectl set image deployment/frasberg-web-client \
            web-client=${{ env.IMAGE_WEB }}:sha-${{ github.sha }} \
            -n frasberg-staging
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/frasberg-game-server \
            -n frasberg-staging --timeout=120s
          kubectl rollout status deployment/frasberg-web-client \
            -n frasberg-staging --timeout=60s
      - name: Run smoke tests
        run: |
          sleep 10
          curl -f https://staging.yourdomain.com/health || exit 1
          echo "✅ Staging smoke test passed"

  # ── JOB 6 — Deploy to Production ────────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy — Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
      - name: Apply K8s manifests
        run: |
          kubectl apply -f infra/k8s-deployment.yaml
      - name: Rolling update — Game Server
        run: |
          kubectl set image deployment/frasberg-game-server \
            game-server=${{ env.IMAGE_GAME }}:sha-${{ github.sha }} \
            -n frasberg
      - name: Rolling update — Web Client
        run: |
          kubectl set image deployment/frasberg-web-client \
            web-client=${{ env.IMAGE_WEB }}:sha-${{ github.sha }} \
            -n frasberg
      - name: Wait for rollout — Game Server
        run: |
          kubectl rollout status deployment/frasberg-game-server \
            -n frasberg --timeout=180s
      - name: Wait for rollout — Web Client
        run: |
          kubectl rollout status deployment/frasberg-web-client \
            -n frasberg --timeout=60s
      - name: Production smoke test
        run: |
          sleep 15
          curl -f https://yourdomain.com/health || exit 1
          curl -f https://game.yourdomain.com/health || exit 1
          echo "✅ Production smoke tests passed"
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "deploy-$(date +%Y%m%d-%H%M%S)" \
            -m "Production deploy — ${{ github.sha }}"
          git push origin --tags

  # ── JOB 7 — Rollback (manual trigger) ───────────────────────────────────────
  rollback:
    name: ⏪ Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rollback'
    environment: production
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
      - name: Rollback game server
        run: |
          kubectl rollout undo deployment/frasberg-game-server -n frasberg
          kubectl rollout status deployment/frasberg-game-server \
            -n frasberg --timeout=120s
      - name: Rollback web client
        run: |
          kubectl rollout undo deployment/frasberg-web-client -n frasberg

  # ── JOB 8 — Notify ──────────────────────────────────────────────────────────
  notify:
    name: 📣 Notify
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success'
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Frasberg — Production Deploy Successful",
                "color": 3066993,
                "fields": [
                  { "name": "Commit", "value": "${{ github.sha }}", "inline": true },
                  { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                  { "name": "Actor", "value": "${{ github.actor }}", "inline": true }
                ]
              }]
            }'
      - name: Notify failure
        if: needs.deploy-production.result == 'failure'
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚨 Frasberg — Production Deploy FAILED",
                "color": 15158332,
                "fields": [
                  { "name": "Commit", "value": "${{ github.sha }}", "inline": true },
                  { "name": "Actor", "value": "${{ github.actor }}", "inline": true },
                  { "name": "Action", "value": "[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false }
                ]
              }]
            }'
