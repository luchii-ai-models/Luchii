apiVersion: v1
kind: Secret
metadata:
  name: luchii-secrets
  namespace: luchii-mesh
type: Opaque
stringData:
  MONGO_URL: "mongodb://mongo.luchii-mesh.svc.cluster.local:27017"
  DB_NAME: "luchii_production"
  REDIS_URL: "redis://redis.luchii-mesh.svc.cluster.local:6379"
  MESH_HMAC_SECRET: "change-me-64-hex-chars"
  JWT_SECRET: "change-me-64-hex-chars"
  EMERGENT_LLM_KEY: "your-llm-gateway-key"
  PAYPAL_CLIENT_ID: "your-paypal-client-id"
  PAYPAL_SECRET: "your-paypal-secret"
  PAYPAL_ENV: "live"
  RESEND_API_KEY: "your-resend-key"
  SENDER_EMAIL: "receipts@yourdomain.com"
  CORS_ORIGINS: "https://yourdomain.com"
