services:

  backend:
    build:
      context: ..
      dockerfile: selfhost/backend.Dockerfile
    container_name: luchii-backend
    restart: always
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - luchii-mesh
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: selfhost/frontend.Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: luchii-frontend
    restart: always
    networks:
      - luchii-mesh

  mongo:
    image: mongo:7
    container_name: luchii-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - luchii-mesh

  redis:
    image: redis:7-alpine
    container_name: luchii-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - luchii-mesh

  nginx:
    image: nginx:alpine
    container_name: luchii-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - luchii-mesh

  certbot:
    image: certbot/certbot
    container_name: luchii-certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - luchii-mesh

networks:
  luchii-mesh:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
