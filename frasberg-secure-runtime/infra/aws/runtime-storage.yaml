AWSTemplateFormatVersion: '2010-09-09'
Description: Shared private media and runtime state storage for Frasberg Secure Runtime.

Resources:
  RuntimeStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frasberg-secure-runtime-state-${AWS::AccountId}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RuntimeMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'frasberg-secure-runtime-assets-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  RuntimeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: frasberg-secure-runtime-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RuntimeStateAndMedia
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt RuntimeStateTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${RuntimeMediaBucket.Arn}/*'

Outputs:
  RuntimeStateTableName:
    Value: !Ref RuntimeStateTable
  RuntimeMediaBucketName:
    Value: !Ref RuntimeMediaBucket
  RuntimeTaskRoleArn:
    Value: !GetAtt RuntimeTaskRole.Arn
