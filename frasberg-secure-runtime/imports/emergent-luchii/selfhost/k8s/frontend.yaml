apiVersion: apps/v1
kind: Deployment
metadata:
  name: luchii-frontend
  namespace: luchii-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luchii-frontend
  template:
    metadata:
      labels:
        app: luchii-frontend
    spec:
      containers:
        - name: luchii-frontend
          image: frasberginc/luchii-frontend:latest   # build with: docker build -f selfhost/frontend.Dockerfile --build-arg REACT_APP_BACKEND_URL=https://yourdomain.com -t frasberginc/luchii-frontend .
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: luchii-frontend
  namespace: luchii-mesh
spec:
  selector:
    app: luchii-frontend
  ports:
    - port: 3000
      targetPort: 3000
