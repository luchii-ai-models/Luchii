version: "3.9"

services:
  frasberg-platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AWS_REGION=us-west-2
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=frasberg-assets
      - R2_PUBLIC_URL=https://assets.frasberg.com
    depends_on:
      - supabase
    networks:
      - frasberg-network

  supabase:
    image: supabase/supabase:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=frasberg_password
      - POSTGRES_DB=frasberg
    networks:
      - frasberg-network

networks:
  frasberg-network:
    driver: bridge
