apiVersion: apps/v1
kind: Deployment
metadata:
  name: frasberg-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frasberg-gateway
  template:
    metadata:
      labels:
        app: frasberg-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/sefaagov/frasberg-gateway:0.1.0
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: frasberg-gateway
spec:
  selector:
    app: frasberg-gateway
  ports:
    - port: 4000
      targetPort: 4000
