# ── Frasberg Carjack Game — Kubernetes Deployment ─────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: frasberg
  labels:
    app: frasberg-game
---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: frasberg-config
  namespace: frasberg
data:
  NODE_ENV: "production"
  PORT: "3001"
  REDIS_URL: "redis://redis-service:6379"
  WS_PATH: "/ws"
---
# ── Secret ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: frasberg-secrets
  namespace: frasberg
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET"
  ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_KEY"
---
# ── Redis Deployment ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: frasberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ── Redis Service ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: frasberg
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ── Game Server Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frasberg-game-server
  namespace: frasberg
  labels:
    app: frasberg-game-server
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frasberg-game-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime deploys
  template:
    metadata:
      labels:
        app: frasberg-game-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: game-server
          image: frasberg/game-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: frasberg-config
            - secretRef:
                name: frasberg-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
# ── Game Server Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frasberg-game-service
  namespace: frasberg
spec:
  selector:
    app: frasberg-game-server
  ports:
    - name: http
      port: 80
      targetPort: 3001
    - name: websocket
      port: 3001
      targetPort: 3001
  type: ClusterIP
---
# ── Web Client Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frasberg-web-client
  namespace: frasberg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frasberg-web-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frasberg-web-client
    spec:
      containers:
        - name: web-client
          image: frasberg/web-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ── Web Client Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frasberg-web-service
  namespace: frasberg
spec:
  selector:
    app: frasberg-web-client
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# ── Ingress ───────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frasberg-ingress
  namespace: frasberg
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - yourdomain.com
        - game.yourdomain.com
      secretName: frasberg-tls
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frasberg-web-service
                port:
                  number: 80
    - host: game.yourdomain.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: frasberg-game-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frasberg-game-service
                port:
                  number: 80
---
# ── Horizontal Pod Autoscaler ─────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frasberg-game-hpa
  namespace: frasberg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frasberg-game-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ── Pod Disruption Budget ─────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frasberg-game-pdb
  namespace: frasberg
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frasberg-game-server
