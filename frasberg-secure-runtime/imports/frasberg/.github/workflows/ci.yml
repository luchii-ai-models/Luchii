name: Frasberg CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/frasberg_ai/**'
      - 'tests/**'
      - 'tsconfig.json'
      - 'deno.json'
  push:
    branches:
      - main
      - feature/bridge-triad
      - feature/final-modulation-triad
      - feature/orchestration-synthesis-triad
      - feature/semantic-modulation-triad

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Validate directory structure
        run: |
          echo "Validating Frasberg AI Application Shell structure..."
          
          # Check required directories exist
          test -d supabase/frasberg_ai/frasberg_ai_application_shell || exit 1
          test -d supabase/frasberg_ai/deviation_engine || exit 1
          test -d supabase/frasberg_ai/identity_filter || exit 1
          test -d supabase/frasberg_ai/membrane_engine || exit 1
          test -d supabase/frasberg_ai/tonal_engine || exit 1
          test -d supabase/frasberg_ai/frasberg_api || exit 1
          test -d supabase/frasberg_ai/continuum_modulator || exit 1
          test -d supabase/frasberg_ai/signature_bridge || exit 1
          test -d supabase/frasberg_ai/orchestration_engine || exit 1
          test -d supabase/frasberg_ai/semantic_bridge || exit 1
          test -d supabase/frasberg_ai/signature_synthesizer || exit 1
          test -d supabase/frasberg_ai/semantic_modulator || exit 1
          test -d supabase/frasberg_ai/signature_router || exit 1
          test -d supabase/frasberg_ai/identity_synthesizer || exit 1
          test -d supabase/frasberg_ai/field_choice || exit 1
          test -d supabase/frasberg_ai/field_resolution || exit 1
          test -d supabase/frasberg_ai/field_commitment || exit 1
          test -d supabase/frasberg_ai/field_execution || exit 1
          test -d supabase/frasberg_ai/field_projection || exit 1
          test -d supabase/frasberg_ai/field_feedback || exit 1
          test -d supabase/frasberg_ai/field_synthesis || exit 1
          test -d supabase/frasberg_ai/field_harmonization || exit 1
          test -d supabase/frasberg_ai/field_stability || exit 1
          test -d supabase/frasberg_ai/field_alignment || exit 1
          test -d supabase/frasberg_ai/field_convergence || exit 1
          test -d supabase/frasberg_ai/field_coherence || exit 1
          test -d supabase/frasberg_ai/field_signature || exit 1
          test -d supabase/frasberg_ai/field_constancy || exit 1
          test -d supabase/frasberg_ai/field_expression || exit 1
          test -d supabase/frasberg_ai/field_presence || exit 1
          test -d supabase/frasberg_ai/field_resonance || exit 1
          test -d supabase/frasberg_ai/field_presence_projection || exit 1
          test -d supabase/frasberg_ai/field_expansion || exit 1
          test -d supabase/frasberg_ai/field_horizon_mapping || exit 1
          test -d supabase/frasberg_ai/field_horizon_continuity || exit 1
          
          # Check required files exist
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_runtime.ts || exit 1
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_index.ts || exit 1
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_context.ts || exit 1
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_lifecycle.ts || exit 1
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_manifest.json || exit 1
          test -f supabase/frasberg_ai/frasberg_ai_application_shell/README.md || exit 1
          
          # Check no nested supabase directories exist
          if find supabase/frasberg_ai -type d -name "supabase" | grep -q .; then
            echo "Error: Nested 'supabase' directories found"
            find supabase/frasberg_ai -type d -name "supabase"
            exit 1
          fi
          
          echo "✓ Directory structure validation passed"
      
      - name: Validate manifest
        run: |
          echo "Validating app_shell_manifest.json..."
          
          # Check JSON is valid using Node.js
          node -e "JSON.parse(require('fs').readFileSync('supabase/frasberg_ai/frasberg_ai_application_shell/app_shell_manifest.json', 'utf8'))"
          
          echo "✓ Manifest validation passed"
